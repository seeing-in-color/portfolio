    </text>
    <text x="80" y="324" fill="#ff9d5c" font-size="46" font-weight="580" letter-spacing="-1.3">
      AI Operations Specialist
    </text>

    <text x="80" y="404" fill="#a2a9b6" font-size="29" font-weight="400">
