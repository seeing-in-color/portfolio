<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Andres Taquechel — AI Operations Specialist">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9d5c" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ff9d5c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1a1f28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#07080a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#ff9d5c"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="86" cy="106" r="7" fill="#5fe0b0"/>
    <text x="106" y="113" fill="#8a8f98" font-size="21" font-weight="500" letter-spacing="3.4">
